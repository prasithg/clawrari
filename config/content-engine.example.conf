# Clawrari Content Engine — example config
#
# Copy to config/content-engine.conf to make it the auto-loaded default:
#   cp config/content-engine.example.conf config/content-engine.conf
#
# This file is sourced as shell by scripts/content-engine.sh, so use plain
# VAR=value lines. CLI flags always override anything set here.
# Note: config/content-engine.conf is gitignored — keep it local.

# Default output directory for drafts (relative to repo root).
# PRA-122: drafts live under docs/content-engine/drafts/ so the cron wrapper,
# cadence doc, and templates all point at the same staging dir.
OUTPUT_DIR="docs/content-engine/drafts"

# Lookback windows in days. Leave WINDOW_DAYS empty to use mode defaults
# (weekly = 7, monthly = 30). Set it only to force a fixed window for both modes.
# WINDOW_DAYS=14

# Treat a specific date as "today" (YYYY-MM-DD). Empty = real today.
# Useful for deterministic regeneration / backfilling a past period.
# AS_OF="2026-06-06"

# Repo to read history from. Empty = the repo this script lives in.
# REPO_ROOT="/path/to/another/repo"

# Draft-only is not configurable: this engine never sends or posts.
