# Model Playbook — Single Source of Truth
# Version: 12
# Last updated: 2026-07-21
#
# Read by: reference docs and scripts/spawn-helper.sh
# Update protocol: bump version, update live OpenClaw config, run the linked eval.

version: 13

models:
  opus-4-8:
    aliases: [opus, opus-4.8, claude-opus-4-8]
    provider: amazon-bedrock
    full_id: amazon-bedrock/us.anthropic.claude-opus-4-8
    role: default-orchestrator | primary-generalist
    capabilities: { reasoning: top, coding: top, tool_use: high, long_context: 1M, vision: high, multimodal: image }
    prompt_style: claude-xml-or-markdown
    effort_default: medium
    cost_tier: premium (Bedrock credits)
    notes: "Default interactive and general-work model. Run at medium unless a named intent overrides it."
    prompt_file: models/opus.md

  gpt-5-6-sol:
    aliases: [sol, gpt-sol, gpt-5.6-sol]
    provider: openai
    full_id: openai/gpt-5.6-sol
    role: default-cross-provider-fallback | conversational-generalist | reviewer | coding | hard-work-backup | eval
    capabilities: { reasoning: top, coding: top, tool_use: top, long_context: 272k, vision: high, multimodal: image }
    prompt_style: gpt5-xml-blocks
    effort_default: medium
    cost_tier: Codex OAuth
    notes: "Use medium for conversational/light GPT work and the default Opus fallback, high for review/coding, and xhigh as the backup for hard autonomous work."
    prompt_file: models/gpt-5.6.md

  gpt-5-6-luna:
    aliases: [luna, gpt-luna, gpt-5.6-luna]
    provider: openai
    full_id: openai/gpt-5.6-luna
    role: quick-interactive-explicit
    capabilities: { reasoning: high, coding: high, tool_use: high, long_context: 1M, vision: high, multimodal: image }
    prompt_style: gpt5-xml-blocks
    effort_default: low
    cost_tier: OpenAI API
    notes: "Explicit quick/light interactive route. Not part of the default, review, coding, or autonomous fallback chains."
    prompt_file: models/gpt-5.6.md

  fable-5:
    aliases: [fable, fable-5, claude-fable-5]
    provider: amazon-bedrock
    full_id: amazon-bedrock/us.anthropic.claude-fable-5
    role: hard-autonomous-primary | reviewer
    capabilities: { reasoning: top, coding: top, tool_use: top, long_context: 1M, vision: high, multimodal: image }
    prompt_style: fable-outcome-contract
    effort_default: xhigh
    cost_tier: premium (Bedrock credits)
    notes: "Use for hard, long-horizon autonomous work. Never ask it to expose raw chain-of-thought."
    prompt_file: models/fable.md

  sonnet-5:
    aliases: [sonnet, sonnet-5, claude-sonnet-5]
    provider: amazon-bedrock
    full_id: amazon-bedrock/us.anthropic.claude-sonnet-5
    role: quick-interactive-explicit
    capabilities: { reasoning: high, coding: high, tool_use: high, long_context: 1M, vision: high, multimodal: image }
    prompt_style: claude-xml-or-markdown
    effort_default: low
    cost_tier: premium (Bedrock credits)
    notes: "Explicit fast Anthropic route. Keep the stable sonnet alias pinned to the latest approved Sonnet version. Not part of fallback chains."
    prompt_file: models/opus.md

  grok-4-5:
    aliases: [grok, grok-4.5]
    provider: openrouter
    full_id: openrouter/x-ai/grok-4.5
    role: specialist-escalation | terminal-cross-provider-fallback
    capabilities: { reasoning: top, coding: high, tool_use: high, long_context: 500k, vision: high, multimodal: image }
    prompt_style: concise-markdown-contract
    effort_default: high
    cost_tier: paid OpenRouter
    notes: "Specialist escalation at high effort and final provider-family fallback after OpenAI."
    prompt_file: models/grok-4.5.md

  kimi-k3:
    aliases: [kimi, kimi-k3, kimik3]
    provider: openrouter
    full_id: openrouter/moonshotai/kimi-k3
    role: explicit-alternative | experimental
    capabilities: { reasoning: top, coding: top, tool_use: high, long_context: 1M, vision: high, multimodal: image }
    prompt_style: openai-compatible-outcome-contract
    effort_default: high
    cost_tier: paid OpenRouter ($3 input / $15 output per 1M tokens)
    notes: "Latest pinned Kimi route. It is the current third-best general fallback after Opus and GPT-5.6 Sol; it remains an explicit comparison route for specialized work."
    prompt_file: models/kimi-k3.md

  gemini-3-5-flash:
    aliases: [flash, gemini-flash, gemini-3.5-flash]
    provider: google
    full_id: google/gemini-3.5-flash
    role: fast-bulk-only
    capabilities: { reasoning: true, coding: high, tool_use: high, long_context: 1M, vision: high, multimodal: image }
    prompt_style: gemini-single-format
    effort_default: low
    cost_tier: low
    notes: "Use only for fast/bulk work: classification, extraction, OCR/vision quick passes, lightweight summarization, and broad fan-out. Never route hard reasoning, strategy, voice, or autonomous work here."
    prompt_file: models/gemini-3.5-flash.md

  glm-5-2:
    aliases: [glm, glm-5.2]
    provider: openrouter
    full_id: openrouter/z-ai/glm-5.2
    role: experimental-only
    capabilities: { reasoning: top, coding: top, tool_use: high, long_context: 1M, vision: none, multimodal: text }
    prompt_style: openai-compatible-thinking-toggle
    effort_default: high
    cost_tier: low-paid OpenRouter
    notes: "Experimental and explicit-invocation only. Never place in a production fallback chain until it passes a dedicated eval."
    prompt_file: models/glm-5.2.md

# Routing intents. Intent-level effort overrides the model default.
intents:
  main_session:
    primary: opus-4-8
    effort: medium
    fallbacks: [gpt-5-6-sol, kimi-k3]
    fallback_effort: { gpt-5-6-sol: medium, kimi-k3: high }
    rationale: "Default interactive chain uses the strongest general model first, GPT-5.6 second, and the current third-best general model third."

  deep_research:
    primary: opus-4-8
    effort: medium
    fallbacks: [gpt-5-6-sol, kimi-k3]
    fallback_effort: { gpt-5-6-sol: medium, kimi-k3: high }
    rationale: "Strong-model synthesis only; Flash may do bounded extraction but never owns the hard synthesis."

  websearch_heavy:
    primary: opus-4-8
    effort: medium
    fallbacks: [gpt-5-6-sol, kimi-k3]
    fallback_effort: { gpt-5-6-sol: medium, kimi-k3: high }
    rationale: "Perplexity remains the search provider; the reasoning/synthesis route stays on frontier models."

  coding_heavy_build:
    primary: gpt-5-6-sol
    effort: xhigh
    fallbacks: [fable-5, grok-4-5]
    fallback_effort: { fable-5: xhigh, grok-4-5: high }
    rationale: "Sol is the coding/reviewer lane; Fable is the Anthropic-family backup for the hardest build work."

  coding_review:
    primary: gpt-5-6-sol
    effort: high
    fallbacks: [fable-5, grok-4-5]
    fallback_effort: { fable-5: high, grok-4-5: high }
    rationale: "Default cross-family reviewer; use Fable when a second Anthropic judgment is useful."

  hard_autonomous_work:
    primary: fable-5
    effort: xhigh
    fallbacks: [gpt-5-6-sol, grok-4-5]
    fallback_effort: { gpt-5-6-sol: xhigh, grok-4-5: high }
    rationale: "Hard autonomous work is Fable xhigh, then Sol xhigh, with Grok as terminal provider fallback."

  long_horizon_autonomous_coding:
    primary: fable-5
    effort: xhigh
    fallbacks: [gpt-5-6-sol, grok-4-5]
    fallback_effort: { gpt-5-6-sol: xhigh, grok-4-5: high }
    rationale: "Fable plans/supervises; substantial code execution can use the Sol-backed Codex wrapper."

  subagent_default:
    primary: opus-4-8
    effort: medium
    fallbacks: [gpt-5-6-sol, kimi-k3]
    fallback_effort: { gpt-5-6-sol: medium, kimi-k3: high }
    rationale: "Routine delegation follows the same general chain as the main session."

  content_drafting:
    primary: opus-4-8
    effort: medium
    fallbacks: [gpt-5-6-sol, kimi-k3]
    fallback_effort: { gpt-5-6-sol: medium, kimi-k3: high }
    rationale: "Opus remains the voice default; Sol medium is the first cross-provider fallback."

  fast_bulk:
    primary: gemini-3-5-flash
    effort: low
    fallbacks: [gpt-5-6-sol]
    fallback_effort: { gpt-5-6-sol: medium }
    rationale: "Flash is strictly bounded to fast/bulk work and never appears in hard-work routes."

  specialist_escalation:
    primary: grok-4-5
    effort: high
    fallbacks: [gpt-5-6-sol, fable-5]
    fallback_effort: { gpt-5-6-sol: high, fable-5: high }
    rationale: "Grok 4.5 is the explicit specialist escalation model."

  ab_testing_evals:
    primary: gpt-5-6-sol
    effort: high
    fallbacks: [fable-5, grok-4-5]
    fallback_effort: { fable-5: high, grok-4-5: high }
    rationale: "Sol runs evals; Fable and Grok provide cross-family comparison."

  cross_model_review:
    primary: gpt-5-6-sol
    effort: high
    secondary: fable-5
    secondary_effort: high
    rationale: "Sol is the normal reviewer; Fable is the alternate reviewer when stronger autonomous judgment is warranted."

  experimental:
    primary: glm-5-2
    effort: high
    fallbacks: []
    rationale: "Explicit experiments only; no production fallback behavior."

# Changelog
# 13 (2026-07-21): Promoted Kimi K3 to the third general fallback after Opus and GPT-5.6 Sol.
# 12 (2026-07-21): Added Kimi K3 through OpenRouter as an explicit-invocation route.
# 11 (2026-07-20): Added Sonnet 5 as the explicit fast Anthropic route; restored native provider-first picker categories; no fallback-chain changes.
# 10 (2026-07-20): Added GPT-5.6 Luna as an explicit quick/light route; no fallback-chain changes.
# 9 (2026-07-15): Retired GPT-5.6 Terra and consolidated all OpenAI work on Sol.
#   - Default: Opus 4.8 medium -> GPT-5.6 Sol medium -> Grok 4.5 high.
#   - Sol effort is intent-specific: medium for conversational/light fallback, high for review/coding, xhigh for hard autonomous backup.
# 8 (2026-07-15): Rebuilt roster and tiers per operator directive.
#   - Default: Opus 4.8 medium -> GPT-5.6 Terra medium -> Grok 4.5 high.
#   - Reviewer/coding: GPT-5.6 Sol; alternate reviewer: Fable 5.
#   - Hard autonomous: Fable 5 xhigh -> GPT-5.6 Sol xhigh -> Grok 4.5 high.
#   - Fast/bulk only: Gemini 3.5 Flash. Specialist: Grok 4.5 high. Experimental: GLM 5.2.
#   - Retired GPT-5.5, GLM 5.1, Gemini 3.1 Pro, older Sonnet, Haiku, and same-provider alternate routes.
