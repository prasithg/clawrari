# Model Playbook — Single Source of Truth
# Version: 14
# Last updated: 2026-09-03
#
# Read by: reference docs and optional workspace routing helpers
# Update protocol: bump version, update runtime configuration, run the linked eval,
# and run scripts/validate-model-playbook.mjs.

