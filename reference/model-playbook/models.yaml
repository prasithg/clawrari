# Routing intents. Intent-level effort overrides the model default.
# Chains are three deep: primary, the other primary, then Grok 4.5 and Muse Spark 1.3
# strictly as resilience after BOTH primaries fail.
intents:
  main_session:
    primary: fable-5-1
    effort: medium
    fallbacks: [gpt-6-astra, grok-4-5, muse-spark-1-3]
    fallback_effort: { gpt-6-astra: medium, grok-4-5: high, muse-spark-1-3: high }
    rationale: "Default interactive chain: Fable 5.1 first, GPT-6 Astra second, then Grok 4.5 and Muse Spark 1.3 only after both primaries fail."

  deep_research:
    primary: fable-5-1
    effort: medium
    fallbacks: [gpt-6-astra, grok-4-5, muse-spark-1-3]
    fallback_effort: { gpt-6-astra: medium, grok-4-5: high, muse-spark-1-3: high }
    rationale: "Strong-model synthesis only; Flash may do bounded extraction but never owns the hard synthesis."

  websearch_heavy:
    primary: fable-5-1
    effort: medium
    fallbacks: [gpt-6-astra, grok-4-5, muse-spark-1-3]
    fallback_effort: { gpt-6-astra: medium, grok-4-5: high, muse-spark-1-3: high }
    rationale: "The search provider supplies evidence; the reasoning/synthesis route stays on frontier models. State explicitly when retrieval is required because Fable 5.1 searches less at low effort."

  subagent_default:
    primary: fable-5-1
    effort: medium
    fallbacks: [gpt-6-astra, grok-4-5, muse-spark-1-3]
    fallback_effort: { gpt-6-astra: medium, grok-4-5: high, muse-spark-1-3: high }
    rationale: "Routine delegation follows the same general chain as the main session."

  content_drafting:
    primary: fable-5-1
    effort: medium
    fallbacks: [gpt-6-astra, grok-4-5, muse-spark-1-3]
    fallback_effort: { gpt-6-astra: medium, grok-4-5: high, muse-spark-1-3: high }
    rationale: "Fable 5.1 is the voice default; Astra medium is the first cross-provider fallback."

  hard_autonomous_work:
    primary: fable-5-1
    effort: xhigh
    fallbacks: [gpt-6-astra, grok-4-5, muse-spark-1-3]
    fallback_effort: { gpt-6-astra: xhigh, grok-4-5: high, muse-spark-1-3: high }
    rationale: "Hard autonomous work is Fable 5.1 xhigh, then Astra xhigh, with Grok then Muse only after both primaries fail."

  coding_heavy_build:
    primary: gpt-6-astra
    effort: xhigh
    fallbacks: [fable-5-1, grok-4-5, muse-spark-1-3]
    fallback_effort: { fable-5-1: xhigh, grok-4-5: high, muse-spark-1-3: high }
    rationale: "Astra (Codex, xhigh) is the coding lane; Fable 5.1 is the cross-family backup for the hardest build work."

  long_horizon_autonomous_coding:
    primary: gpt-6-astra
    effort: xhigh
    fallbacks: [fable-5-1, grok-4-5, muse-spark-1-3]
    fallback_effort: { fable-5-1: xhigh, grok-4-5: high, muse-spark-1-3: high }
    rationale: "Fable plans and supervises; substantial code execution uses the Astra-backed Codex wrapper."

  coding_review:
    primary: gpt-6-astra
    effort: high
    fallbacks: [fable-5-1, grok-4-5, muse-spark-1-3]
    fallback_effort: { fable-5-1: high, grok-4-5: high, muse-spark-1-3: high }
    rationale: "Default cross-family reviewer; use Fable when a second Anthropic judgment is useful."

  specialist_escalation:
    primary: gpt-6-astra
    effort: high
    fallbacks: [fable-5-1, grok-4-5, muse-spark-1-3]
    fallback_effort: { fable-5-1: high, grok-4-5: high, muse-spark-1-3: high }
    rationale: "Difficult specialist judgment stays on the two primaries; Grok then Muse only after both fail."

  ab_testing_evals:
    primary: gpt-6-astra
    effort: high
    fallbacks: [fable-5-1, grok-4-5, muse-spark-1-3]
    fallback_effort: { fable-5-1: high, grok-4-5: high, muse-spark-1-3: high }
    rationale: "Astra runs evals; Fable 5.1 is the alternate. Grok then Muse are resilience fallbacks after both fail."

  cross_model_review:
    primary: gpt-6-astra
    effort: high
    secondary: fable-5-1
    secondary_effort: high
    rationale: "Astra is the normal reviewer; Fable 5.1 is the alternate reviewer when stronger autonomous judgment is warranted."

  artifact_creation:
    primary: gpt-6-astra
    effort: medium
    fallbacks: [fable-5-1, grok-4-5, muse-spark-1-3]
    fallback_effort: { fable-5-1: medium, grok-4-5: high, muse-spark-1-3: high }
    rationale: "Astra subagent lane; vary effort by task. Grok then Muse only after both primaries fail."

  computer_use:
    primary: gpt-6-astra
    effort: medium
    fallbacks: [fable-5-1, grok-4-5, muse-spark-1-3]
    fallback_effort: { fable-5-1: medium, grok-4-5: high, muse-spark-1-3: high }
    rationale: "Astra subagent lane; vary effort by task. Grok then Muse only after both primaries fail."

  fast_bulk:
    primary: gemini-3-7-flash
    effort: low
    fallbacks: [gpt-6-astra, fable-5-1]
    fallback_effort: { gpt-6-astra: low, fable-5-1: low }
    rationale: "Flash is strictly bounded to classification, extraction, and OCR; it never appears in hard-work routes."

  council_third_seat:
    primary: grok-4-5
    effort: high
    rationale: "Standing third-family council seat. Synthesis: a non-seated model, or dual Fable xhigh + Astra xhigh grading with the grader gap reported."

  council_fourth_strategy:
    primary: muse-spark-1-3
    effort: high
    rationale: "Optional strategy/positioning provocateur; not correctness-critical review. Dual-grader rule unchanged."

  anthropic_family_backup:
    primary: opus-5
    effort: high
    rationale: "Fable-specific outage while the provider is still available; never a council seat."

  experimental_fast_bulk_candidate:
    primary: glm-5-3
    effort: high
    fallbacks: []
    rationale: "Candidate for bounded extraction/classification; utility eval pending, Flash default unchanged. Explicit experiments only."

