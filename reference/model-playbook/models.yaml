# Model Playbook — Single Source of Truth
# Version: 15
# Last updated: 2026-09-11
#
# Read by: reference docs and optional workspace routing helpers
# Update protocol: bump version, update runtime configuration, run the linked eval,
# and run scripts/validate-model-playbook.mjs.
#
# This roster is an example. It records one working stack; it does not imply that
# every user has access to every provider or model listed here.

version: 15

models:
  fable-5-1:
    display_name: Fable 5.1
    aliases: [fable, fable-5.1, claude-fable-5-1]
    provider: amazon-bedrock
    full_id: amazon-bedrock/us.anthropic.claude-fable-5-1
    status: active
    role: default-orchestrator | primary-generalist | hard-autonomous-primary | alternate-reviewer | voice
    capabilities: { reasoning: top, coding: top, tool_use: top, long_context: 1M, vision: high, multimodal: image }
    prompt_style: fable-outcome-contract
    effort_default: medium
    cost_tier: premium
    notes: "Primary route for main/default sessions, crons, routine delegation, research synthesis, and voice-sensitive work. Vary effort by task: low for light interaction, medium for routine work, high for difficult judgment or alternate review, xhigh for hard autonomous work. Never ask it to expose raw chain-of-thought."
    prompt_file: models/fable.md

  gpt-6-astra:
    display_name: GPT-6 Astra
    aliases: [astra, gpt-astra, gpt-6-astra, gpt6]
    provider: openai
    full_id: openai/gpt-6-astra
    status: active
    role: default-cross-provider-fallback | reviewer | coding | artifacts | computer-use | hard-work-backup | eval
    capabilities: { reasoning: top, coding: top, tool_use: top, long_context: 1M, vision: high, multimodal: image, computer_use: top }
    prompt_style: astra-outcome-autonomy-contract
    effort_default: xhigh
    cost_tier: Codex OAuth (CLI) or OpenAI API
    notes: "OpenAI lane since 2026-09-09; replaces GPT-5.6 Sol. Owns coding, review, artifact, and computer-use lanes with effort varied by task: xhigh for substantial coding and hard-work backup, high for review and evals, medium for routine implementation and as fallback #1 for Fable, low as the light-task floor. Always include the autonomy preamble in unattended lanes. No temperature/top_p; no none effort."
    prompt_file: models/gpt-6-astra.md

  grok-4-5:
    display_name: Grok 4.5
    aliases: [grok, grok-4.5]
    provider: openrouter
    full_id: openrouter/x-ai/grok-4.5
    status: active
    role: council-third-seat | resilience-fallback-2
    capabilities: { reasoning: top, coding: high, tool_use: high, long_context: 500k, vision: high, multimodal: image }
    prompt_style: concise-markdown-contract
    effort_default: high
    cost_tier: paid OpenRouter
    notes: "Standing third-family council seat and resilience fallback #2. Invoke as a fallback only after BOTH Fable 5.1 and GPT-6 Astra have failed; never as a chosen task lane."
    prompt_file: models/grok-4.5.md

  muse-spark-1-3:
    display_name: Muse Spark 1.3
    aliases: [muse, muse-spark, muse-spark-1.3]
    provider: openrouter
    full_id: openrouter/meta/muse-spark-1.3
    status: active
    role: resilience-fallback-3 | council-fourth-strategy-positioning
    capabilities: { reasoning: high, coding: high, tool_use: unverified, long_context: unverified, vision: unverified, multimodal: text }
    prompt_style: concise-markdown-evidence-contract
    effort_default: high
    cost_tier: paid OpenRouter
    notes: "Resilience fallback #3 after both primaries and Grok 4.5. Optional fourth council lane for strategy/positioning provocation; not for correctness-critical review. Tool-enabled work was not verified by the source evaluation."
    prompt_file: models/muse-spark-1.3.md

  gemini-3-7-flash:
    display_name: Gemini 3.7 Flash
    aliases: [flash, gemini-flash, gemini-3.7-flash]
    provider: google
    full_id: google/gemini-3.7-flash
    status: active
    role: fast-bulk-only
    capabilities: { reasoning: true, coding: high, tool_use: high, long_context: 1M, vision: high, multimodal: image }
    prompt_style: gemini-single-format
    effort_default: low
    cost_tier: low
    notes: "Bounded classification, extraction, and OCR only. Never route summaries, synthesis, strategy, voice, review, or autonomous work here. A task merely mentioning bulk or speed does not qualify."
