# Routing intents. Intent-level effort overrides the model default.
intents:
  main_session:
    primary: fable-5-1
    effort: medium
    fallbacks: [gpt-5-6-sol, kimi-k3]
    fallback_effort: { gpt-5-6-sol: max, kimi-k3: high }
    rationale: "Use the strongest tested general model as the default, then cross provider boundaries for continuity."

  deep_research:
    primary: fable-5-1
    effort: medium
    fallbacks: [gpt-5-6-sol, kimi-k3]
    fallback_effort: { gpt-5-6-sol: max, kimi-k3: high }
    rationale: "Strong-model synthesis only; bounded extraction may use the fast lane, but final synthesis does not."

  websearch_heavy:
    primary: fable-5-1
    effort: high
    fallbacks: [gpt-5-6-sol, kimi-k3]
    fallback_effort: { gpt-5-6-sol: max, kimi-k3: high }
    rationale: "Use explicit retrieval instructions and raise effort because low-effort Fable 5.1 tends to search less."

  coding_heavy_build:
    primary: gpt-5-6-sol
    effort: max
    fallbacks: [fable-5-1, grok-4-5]
    fallback_effort: { fable-5-1: xhigh, grok-4-5: high }
    rationale: "Sol is the coding lane; use xhigh when the runtime does not expose max."

  coding_review:
    primary: gpt-5-6-sol
    effort: max
    fallbacks: [fable-5-1, grok-4-5]
    fallback_effort: { fable-5-1: high, grok-4-5: high }
    rationale: "Sol owns independent review; Fable provides the alternate model-family judgment."

  hard_autonomous_work:
    primary: fable-5-1
    effort: xhigh
    fallbacks: [gpt-5-6-sol, grok-4-5]
    fallback_effort: { gpt-5-6-sol: max, grok-4-5: high }
    rationale: "Hard autonomous work starts on Fable xhigh, crosses to Sol, then uses Grok as the terminal specialist fallback."

  long_horizon_autonomous_coding:
    primary: fable-5-1
    effort: xhigh
    fallbacks: [gpt-5-6-sol, grok-4-5]
    fallback_effort: { gpt-5-6-sol: max, grok-4-5: high }
    rationale: "Fable plans and supervises; substantial code execution uses the Sol coding lane."

  subagent_default:
    primary: fable-5-1
    effort: medium
    fallbacks: [gpt-5-6-sol, kimi-k3]
    fallback_effort: { gpt-5-6-sol: max, kimi-k3: high }
    rationale: "Routine delegation follows the same two-model operational core as the main session."

  content_drafting:
    primary: fable-5-1
    effort: medium
    fallbacks: [gpt-5-6-sol, kimi-k3]
    fallback_effort: { gpt-5-6-sol: max, kimi-k3: high }
    rationale: "Use Fable for the first draft, then enforce the publication-specific voice gate independently."

  fast_bulk:
    primary: gemini-3-5-flash
    effort: low
    fallbacks: [fable-5-1]
    fallback_effort: { fable-5-1: medium }
    rationale: "Flash is strictly bounded to fast/bulk work and never owns hard judgment or final synthesis."

  specialist_escalation:
    primary: grok-4-5
    effort: high
    fallbacks: [gpt-5-6-sol, fable-5-1]
    fallback_effort: { gpt-5-6-sol: max, fable-5-1: high }
    rationale: "Grok is the explicit specialist route; the operational core remains available as fallback."

  ab_testing_evals:
    primary: gpt-5-6-sol
    effort: max
    fallbacks: [fable-5-1, grok-4-5]
    fallback_effort: { fable-5-1: high, grok-4-5: high }
    rationale: "Sol runs evals; Fable and Grok provide cross-family comparison."

  cross_model_review:
    primary: gpt-5-6-sol
    effort: max
    secondary: fable-5-1
    secondary_effort: high
    rationale: "Sol is the normal reviewer; Fable is the alternate reviewer and orchestration peer."

  experimental:
    primary: glm-5-2
    effort: high
    fallbacks: []
    rationale: "Explicit experiments only; no production fallback behavior."

# Changelog
# 14 (2026-09-03): Promoted Fable 5.1 to the primary route, made Sol max the
#   backup/reviewer/coding lane, retired Opus 4.8, and kept Kimi as the
#   third-place emergency fallback. Added status fields for enforceable retirement.
# 13 (2026-07-21): Promoted Kimi K3 to the third general fallback after Opus and GPT-5.6 Sol.
# 12 (2026-07-21): Added Kimi K3 through OpenRouter as an explicit-invocation route.
# 11 (2026-07-20): Added Sonnet 5 as the explicit fast Anthropic route; restored native provider-first picker categories; no fallback-chain changes.
# 10 (2026-07-20): Added GPT-5.6 Luna as an explicit quick/light route; no fallback-chain changes.
# 9 (2026-07-15): Retired GPT-5.6 Terra and consolidated all OpenAI work on Sol.
#   - Default: Opus 4.8 medium -> GPT-5.6 Sol medium -> Grok 4.5 high.
#   - Sol effort is intent-specific: medium for conversational/light fallback, high for review/coding, xhigh for hard autonomous backup.
# 8 (2026-07-15): Rebuilt roster and tiers.
#   - Default: Opus 4.8 medium -> GPT-5.6 Terra medium -> Grok 4.5 high.
#   - Reviewer/coding: GPT-5.6 Sol; alternate reviewer: Fable 5.
#   - Hard autonomous: Fable 5 xhigh -> GPT-5.6 Sol xhigh -> Grok 4.5 high.
#   - Fast/bulk only: Gemini 3.5 Flash. Specialist: Grok 4.5 high. Experimental: GLM 5.2.
#   - Retired GPT-5.5, GLM 5.1, Gemini 3.1 Pro, older Sonnet, Haiku, and same-provider alternate routes.
